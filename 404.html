<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="assets/Videos/SenpaiWorks logo.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Your Way? (404) — SenpaiWorks Official</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="404.css">
</head>

<body>

  <!-- Top Left Brand Logo (Matching Login Page Style) -->
  <a href="home" class="auth-top-left-logo" title="Back to Home">
    <img src="assets/SenpaiWorks logo.png" alt="SenpaiWorks Logo" class="auth-logo-img">
    <h2 class="auth-logo-text">
      <span class="big">S</span>ENPAI<span class="big">W</span>ORKS
    </h2>
  </a>

  <!-- 404 Hero Content Wrapper (Netflix Reference Style) -->
  <main class="error-content-container">
    <h1 class="error-headline">Lost your way?</h1>
    <p class="error-subheadline">
      Sorry, we can't find that page. You'll find lots to explore on the home page.
    </p>

    <a href="home" class="error-home-btn">
      SenpaiWorks Home
    </a>

    <div class="error-code-tag">
      Error Code <span>SW-404</span>
    </div>
  </main>

  <!-- Bottom Right Artwork Attribution -->
  <div class="error-bg-attribution">
    FROM <span class="highlight">ONE PIECE REFERERNCE</span>
  </div>

</body>

</html>
