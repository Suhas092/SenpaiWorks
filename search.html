  <div class="search-hero">
    <h1>Search results</h1>
    <form class="search-form" onsubmit="return searchContent(event)">
      <input class="search-input" type="text" id="searchInput" placeholder="What are you looking for?" autocomplete="off" autofocus>
      <button class="search-btn" type="submit">
        <svg class="search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="white" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="white" stroke-width="2"/>
        </svg>
        <span style="display:none;">Search</span>
      </button>
    </form>
  </div>

  <section class="results-section">
    <div class="results-header" id="resultsHeader">Type to search your favorite art or character…</div>
    <div class="results-grid" id="resultsGrid">
      <!-- Search results appear here -->
    </div>
  </section>

  <script>
    // Placeholder search dataset (sample gallery)
    const items = [

      { title: "Miku Nakano", category: "Digital Art", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630824/miku_full_copy_vdritm.webp", link: "#" },
      { title: "Mikasa", category: "Digital Art", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630823/Mikasa_copy_jcwuga.webp", link: "#" },
      { title: "Li Shiya", category: "Digital Art", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630823/li_shiya_copy_jyopqy.webp", link: "#" },
      { title: "Nico Robin", category: "Digital Art", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630824/nico_robin_copy_eoj6o4.webp", link: "#" },
      { title: "Zoro", category: "Insane Artwork", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630823/zoro_copy_bki4to.webp", link: "#" },
      { title: "Itachi", category: "Insane Artwork", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630822/itachi_copy_laotwi.webp", link: "#" },
      { title: "Kaneki", category: "Insane Artwork", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630822/itachi_copy_laotwi.webp", link: "#" },
      { title: "Rose", category: "Color Pencil", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630824/rose_copy_hqkhss.webp", link: "#" },
      { title: "IU", category: "Color Pencil", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630822/iu_copy_cdbits.webp", link: "#" },
      { title: "Lisa", category: "Color Pencil", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630823/lisa_copy_zsrdfj.webp", link: "#" },
      { title: "Jhope", category: "Charcoal Pencil", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630820/jhope_copy_sregrz.webp", link: "#" },
      { title: "Jungkook", category: "Charcoal Pencil", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630820/jungkook_copy_ntfb24.webp", link: "#" },
      { title: "Zero 2 Infinity", category: "Digital Logo", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630849/zero_2_infinity_aipeww.webp", link: "#" },
      { title: "Chronos Play", category: "Digital Logo", img: "https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_600/v1757630848/chronos_plays_fl47xm.webp", link: "#" },
      // ...add your actual gallery
    ];

    function searchContent(event){
      event.preventDefault();
      updateSearchResults();
      return false;
    }
    function updateSearchResults() {
      const grid = document.getElementById('resultsGrid');
      const header = document.getElementById('resultsHeader');
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      let results = [];
      if (q.length === 0) {
        header.textContent = "Type to search your favorite art or character…";
        grid.innerHTML = "";
        return;
      }
      results = items.filter(item =>
        item.title.toLowerCase().includes(q) ||
        item.category.toLowerCase().includes(q)
      );
      header.textContent = results.length
        ? `Results for "${q}"`
        : `No results found for "${q}"`;
      grid.innerHTML = results.map(item => `
        <a class="result-card" href="${item.link}">
          <img src="${item.img}" alt="${item.title}">
          <div class="result-card-title">${item.title}</div>
          <div class="result-card-meta">${item.category}</div>
        </a>
      `).join('');
    }
    document.getElementById('searchInput').addEventListener('input', updateSearchResults);
  </script>
