<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Catalog & Studio Assets — SenpaiWorks</title>
  <meta name="description"
    content="Search SenpaiWorks digital storefront, 2D art galleries, Suzens virtual idol band members, news stories, and 3D masterclasses." />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Global Styles & Page Styles -->
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="drawer.css" />
  <link rel="stylesheet" href="footer.css" />
  <link rel="stylesheet" href="search.css" />
</head>

<body>
  <!-- Dynamic Header Placeholder -->
  <div id="header-placeholder">
    <script>
      (function () {
        var cached = sessionStorage.getItem('cached_header');
        if (cached) {
          document.getElementById('header-placeholder').innerHTML = cached;
        }
      })();
    </script>
  </div>
  <script src="scripts/header.js?v=7"></script>

  <!-- Side Drawer Container -->
  <div id="drawer-container"></div>
  <script src="scripts/drawer.js?v=7"></script>

  <!-- SEARCH HERO BANNER -->
  <section class="search-hero">
    <h1>STUDIO CATALOG <span style="color: #0284c7;">SEARCH</span></h1>
    <p>Find merchandise, 2D artworks, Suzens band tracks, news stories, and masterclass tutorials.</p>

    <div class="search-form-wrap">
      <form class="search-input-box" id="searchForm">
        <i class="fa-solid fa-magnifying-glass search-input-icon"></i>
        <input class="search-input" type="text" id="searchInput" placeholder="Search characters, hoodies, art, or tutorials..."
          autocomplete="off" autofocus />
        <button type="button" class="search-clear-btn" id="searchClearBtn" style="display: none;" title="Clear Search">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <button class="search-submit-btn" type="submit">Search</button>
      </form>
    </div>
  </section>

  <!-- RESULTS & FILTER SECTION -->
  <section class="results-section">
    <div class="search-controls-bar">
      <!-- Category Filter Pills -->
      <div class="search-filter-pills">
        <button type="button" class="search-filter-pill active" data-filter="all">
          All <span class="pill-count">0</span>
        </button>
        <button type="button" class="search-filter-pill" data-filter="store">
          <i class="fa-solid fa-bag-shopping"></i> Store & Merch <span class="pill-count">0</span>
        </button>
        <button type="button" class="search-filter-pill" data-filter="artwork">
          <i class="fa-solid fa-palette"></i> 2D Artworks <span class="pill-count">0</span>
        </button>
        <button type="button" class="search-filter-pill" data-filter="band">
          <i class="fa-solid fa-music"></i> Virtual Band <span class="pill-count">0</span>
        </button>
        <button type="button" class="search-filter-pill" data-filter="news">
          <i class="fa-solid fa-newspaper"></i> News & Editorial <span class="pill-count">0</span>
        </button>
        <button type="button" class="search-filter-pill" data-filter="learn">
          <i class="fa-solid fa-graduation-cap"></i> Courses <span class="pill-count">0</span>
        </button>
      </div>

      <!-- Sort Controls -->
      <div class="search-sort-wrap">
        <label for="searchSortSelect">Sort By:</label>
        <select id="searchSortSelect" class="search-sort-select">
          <option value="relevance" selected>Relevance</option>
          <option value="name-asc">Name (A - Z)</option>
          <option value="price-low">Price (Low to High)</option>
          <option value="price-high">Price (High to Low)</option>
        </select>
      </div>
    </div>

    <!-- Search Results Header Summary -->
    <div class="results-header" id="resultsHeader"></div>

    <!-- Results Cards Grid -->
    <div class="results-grid" id="resultsGrid">
      <!-- Search results generated dynamically by scripts/search.js -->
    </div>
  </section>

  <!-- Contact & Footer Container -->
  <div id="contact-container"></div>
  <script src="scripts/contact.js"></script>
  <script>
    loadContactSection("https://res.cloudinary.com/dmzchsqms/image/upload/f_auto,q_auto/w_auto/v1757630820/to_love_ru_copy_sthzsw.webp");
  </script>

  <div id="footer-container"></div>
  <script src="scripts/footer.js"></script>

  <!-- Store Products Data Source -->
  <script src="scripts/products-data.js"></script>

  <!-- Live Search Engine Script -->
  <script src="scripts/search.js"></script>
</body>

</html>
